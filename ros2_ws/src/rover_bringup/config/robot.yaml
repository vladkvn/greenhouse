# ЕДИНЫЙ ИСТОЧНИК ГЕОМЕТРИИ РОВЕРА.
# Правишь ТУТ → меняется URDF/TF всех сенсоров, футпринт Nav2, интринсики и проекция камеры.
# Работает на любом шасси: перенёс лидар/камеру — поправил числа здесь, пересобрал.
#
# Позы сенсоров заданы в кадре base_footprint (точка на ПОЛУ под центром оси):
#   xyz = [x вперёд, y влево, z ВЫСОТА НАД ПОЛОМ], м   — z удобно мерить рулеткой от пола
#   rpy = [roll, pitch, yaw], рад                       — pitch>0 наклоняет камеру ВНИЗ
# URDF сам переведёт z над полом в кадр base_link.

footprint_radius: 0.42     # м — описанная окружность шасси 65×54см: √(0.325²+0.27²)≈0.42. Nav2 держит центр
                           # не ближе к препятствиям. Для узких проёмов можно перейти на прямоугольный футпринт.
wheel_base: 0.54           # м — колея (центр↔центр ведущих колёс), замер. Уточнить 360°-тестом
                           # (если это внешняя ширина с колёсами — реальная колея чуть меньше). # CALIBRATE

base:                       # габариты корпуса: телега 65×54 с колёсами (платформа-основа 60×40)
  length: 0.65              # X, м
  width:  0.54              # Y, м (с колёсами)
  height: 0.15              # Z, м  # CALIBRATE
wheel_radius: 0.0825        # м — радиус колеса Ø165мм (замер): высота base_link + пересчёт одометрии VESC.

# Привод: Dual VESC (Flipsky 6.7), 2 мотора-гироскутера (BLDC, FOC + датчики Холла).
# Обе половины — каждая по СВОЕМУ USB, командуем/читаем напрямую (без forward-CAN).
# Узел vesc_diff_drive берёт геометрию (wheel_radius, wheel_base) отсюда же — единый источник.
drivetrain:
  # X5100 dual: ОДИН USB на обе половины. local (id 65) напрямую, вторая (id 66) через forward-CAN.
  # Узел находит половину по VESC-id: отвечает напрямую → local, иначе → forward-CAN на том же порту.
  ports: [/dev/ttyACM0, /dev/ttyACM1]   # X5100 один USB, но при переэнумерации садится то на ACM0, то ACM1 —
                                        # узел открывает оба и берёт тот, где ответила плата (local id65 + CAN 66)
  pole_pairs: 20            # новые 24В моторы: 20 пар полюсов (замер по тахометру: 1199 тиков / 10 оборотов)
  gear_ratio: 1.0           # прямой привод (хаб-мотор), редуктора нет
  # ── ЧЕРЕПАШИЙ ПЛАВНЫЙ ПРОФИЛЬ (16.08.2026) ────────────────────────────────────────────────
  # Новые симметричные 24В моторы не нуждаются в компенсациях старого «мёртвого» борта — они
  # давали рывки. Убраны срыв-стикции и связка курса; мягкий разгон/торможение, низкий потолок.
  # В скобках — прежнее значение (для бисекта, если станет вяло стартовать → поднимать kp/kff).
  max_speed: 0.4            # м/с — потолок под LIN 0.20 + дугу (запас); поднимем ещё когда нужно
  accel_limit: 0.4          # (было 1.2) м/с² — мягкий разгон/торможение цели скорости
  cmd_timeout: 0.4          # с — тишина в cmd_vel → выбег
  rate_hz: 30.0             # (было 50) X5100: вторая половина по forward-CAN — на 50 Гц фидбэк не
                            # успевает round-trip и PI входит в разнос; 30 Гц стабильнее по CAN
  # Замкнутый контур скорости ОТДАН самому VESC (SET_RPM): держит обороты своим быстрым локальным
  # контуром → нагрузко-инвариантно (догрузили вес → сам поднимет ток) и не зависит от лага forward-CAN.
  # Наш PI по току (kp/ki/kff/stiction ниже) при этом НЕ используется — оставлен как fallback (control_mode: current).
  control_mode: rpm         # замкнутый контур внутри VESC (speed-PID настроен: Min ERPM 50 на обеих)
  rpm_min_erpm: 0.0
  # Детект застревания: колесо под командой, но не крутится дольше stall_time_s → снять тягу на
  # stall_hold_s (не качать ток, не сорваться рывком). В rpm-режиме — единственная защита от застревания.
  stall_detect: true
  stall_erpm: 40.0          # |изм.eRPM| ниже = «колесо стоит» (≈0.017 м/с при pp20)
  stall_time_s: 0.7         # держим дольше нормального срыва старта (~0.3с) → без ложных срабатываний
  stall_hold_s: 1.0         # на столько снимаем тягу после детекта, потом повторная попытка
  # Замкнутый контур скорости по току: ток = kff·v + kp·ошибка + ki·∫ошибка. Компенсирует нагрузку
  # и разницу моторов, стартует с низов. Больше груз → сам поднимает ток (до max_current).
  # FEEDFORWARD-доминантный контур: базовый ток несёт kff, PI лишь слегка правит. Так задержка
  # forward-CAN фидбэка (вторая половина по CAN) НЕ раскачивает контур → нет предельного цикла вкл/выкл.
  speed_kp: 1.5             # трим по ошибке скорости
  speed_ki: 4.0             # держит скорость (сустейн); было 1 — мало, тележка глохла после толчка
  speed_kff: 12.0           # А на м/с — упреждение несёт базовый ток (~1.2А при 0.1 м/с), чтобы форвард
                            # ехал НЕПРЕРЫВНО, не опираясь на лаговый forward-CAN фидбэк. Перелёт → срезать
  brake_a: 1.5              # (было 4.0) А — мягкий тормоз на стоп (не резкий клевок в конце)
  current_slew_s: 0.15      # быстрее строит ток → трогается без долгого ожидания, но плавно
  stiction_a: 4.0           # крепче толчок на срыв старта (2.5 не хватало → ждал секунды); фаза только
                            # при стоящем колесе + команде, защёлка moving гасит повтор на ходу
  stiction_v: 0.05          # м/с — ниже этого колесо считается стоящим (порог срыва)
  heading_ksync: 2.0        # связка курса от увода вправо; ниже (3→2), чтобы лаговый фидбэк не качал
  max_current: 8.0          # А — потолок под нагрузкой пола (3.5 не хватало тронуться). На черепашьей
                            # скорости PI столько не запросит; запас нужен на срыв старта.
  left:
    vesc_id: 66             # борта переставлены по факту WASD: левый = id66 (forward-CAN)
    invert: false           # знак так, чтобы + = вперёд                 # CALIBRATE
  right:
    vesc_id: 65             # правый = id65 (local, прямой USB)
    invert: false           # +ток = вперёд на ОБОИХ бортах; направление проверим WASD-джогом.
                            # Инверсий на этом шасси нет; VESC Tool задаёт «forward»-фазу каждого мотора.

sensors:
  # base_footprint = ось ведущих колёс (центр вращения), стоит СЗАДИ — 56см от переднего края телеги.
  # Корпус целиком впереди оси → все сенсоры с +x. z = высота над полом (рулеткой).
  lidar:                    # RPLIDAR A1: развёрнут 180° (разъём вперёд)
    xyz: [0.43, 0.0, 0.195] # 43см вперёд от оси, по центру, 19.5см над полом
    rpy: [0.0, 0.0, 3.14159265]   # yaw=π (монтаж 180°, разъём вперёд)

  camera:                   # моно USB, по центру, смотрит вперёд ровно
    xyz: [0.56, 0.0, 0.11]  # передний край (56см вперёд от оси), 11см над полом  # CALIBRATE x, если камера утоплена
    rpy: [0.0, 0.0, 0.0]    # CALIBRATE небольшой pitch/перекос — критично для проекции на пол
    hfov_deg: 70.0          # поле зрения — для интринсик и пеленга  # CALIBRATE
    width:  1280            # px
    height: 720             # px

  imu:                      # BNO085 — рядом с лидаром, на 3см ближе к оси. Позиция некритична (фьюзим yaw/vyaw)
    xyz: [0.40, 0.0, 0.10]  # 40см вперёд от оси; z ≈ высота платы  # CALIBRATE z
    rpy: [0.0, 0.0, 0.0]    # CALIBRATE roll=π если курс зеркалит
