# ЕДИНЫЙ ИСТОЧНИК ГЕОМЕТРИИ РОВЕРА.
# Правишь ТУТ → меняется URDF/TF всех сенсоров, футпринт Nav2, интринсики и проекция камеры.
# Работает на любом шасси: перенёс лидар/камеру — поправил числа здесь, пересобрал.
#
# Позы сенсоров заданы в кадре base_footprint (точка на ПОЛУ под центром оси):
#   xyz = [x вперёд, y влево, z ВЫСОТА НАД ПОЛОМ], м   — z удобно мерить рулеткой от пола
#   rpy = [roll, pitch, yaw], рад                       — pitch>0 наклоняет камеру ВНИЗ
# URDF сам переведёт z над полом в кадр base_link.

footprint_radius: 0.22     # м — описанная окружность шасси (≈ лист A4 21×30см) + ЗАПАС.
                           # Nav2 держит центр робота не ближе этого к препятствиям.
wheel_base: 0.50           # м — колея (расстояние левое↔правое колесо); её ест diff-drive VESC. # CALIBRATE новое шасси

base:                       # габариты корпуса (визуал + collision + футпринт)
  length: 0.30              # X, м  # CALIBRATE новое шасси
  width:  0.21              # Y, м  # CALIBRATE новое шасси
  height: 0.07              # Z, м  # CALIBRATE новое шасси
wheel_radius: 0.0825        # м — радиус колеса (6.5" гироскутер): высота base_link + пересчёт одометрии VESC. # CALIBRATE замерь

# Привод: Dual VESC (Flipsky 6.7), 2 мотора-гироскутера (BLDC, FOC + датчики Холла), одна плата, один USB.
# Локальную половину командуем напрямую по USB, вторую — forward-CAN по её внутреннему CAN-id.
# Узел vesc_diff_drive берёт геометрию (wheel_radius, wheel_base) отсюда же — единый источник.
drivetrain:
  port: /dev/ttyACM0        # USB-CDC локальной половины VESC
  local_id: 52              # CAN-id половины на USB (её командуем напрямую, без forward-CAN)
  pole_pairs: 15            # 30 магнитов = 15 пар полюсов (подтверждено детектом VESC Tool)
  gear_ratio: 1.0           # прямой привод (хаб-мотор), редуктора нет
  max_speed: 1.0            # м/с — потолок команды
  accel_limit: 1.2          # м/с² — ограничение ускорения (плавный старт/стоп)
  cmd_timeout: 0.4          # с — тишина в cmd_vel → выбег
  rate_hz: 50.0             # Гц — цикл управления и опрос одометрии
  left:
    can_id: 52              # половина левого борта      # CALIBRATE если борта перепутаны
    invert: false           # знак так, чтобы + = вперёд  # CALIBRATE на первом пуске
  right:
    can_id: 4               # половина правого борта      # CALIBRATE
    invert: true            # правый борт зеркальный       # CALIBRATE

sensors:
  lidar:                    # RPLIDAR A1: развёрнут на 180°, стоит позади центра
    xyz: [-0.13, 0.0, 0.10] # CALIBRATE
    rpy: [0.0, 0.0, 3.14159265]   # yaw=π (монтаж 180°)  # CALIBRATE

  camera:                   # ArduCam моно USB, смотрит вперёд (коаксиально лидару)
    xyz: [-0.13, 0.0, 0.12] # CALIBRATE высоту камеры над полом
    rpy: [0.0, 0.0, 0.0]    # CALIBRATE наклон вниз (pitch); критично для проекции на пол
    hfov_deg: 70.0          # горизонтальное поле зрения — для интринсик и пеленга # CALIBRATE
    width:  1280            # px
    height: 720             # px

  imu:                      # BNO085
    xyz: [0.0, 0.0, 0.05]
    rpy: [0.0, 0.0, 0.0]    # CALIBRATE roll=π если курс зеркалит
