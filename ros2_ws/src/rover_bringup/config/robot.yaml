# ЕДИНЫЙ ИСТОЧНИК ГЕОМЕТРИИ РОВЕРА.
# Правишь ТУТ → меняется URDF/TF всех сенсоров, футпринт Nav2, интринсики и проекция камеры.
# Работает на любом шасси: перенёс лидар/камеру — поправил числа здесь, пересобрал.
#
# Позы сенсоров заданы в кадре base_footprint (точка на ПОЛУ под центром оси):
#   xyz = [x вперёд, y влево, z ВЫСОТА НАД ПОЛОМ], м   — z удобно мерить рулеткой от пола
#   rpy = [roll, pitch, yaw], рад                       — pitch>0 наклоняет камеру ВНИЗ
# URDF сам переведёт z над полом в кадр base_link.

footprint_radius: 0.42     # м — описанная окружность шасси 65×54см: √(0.325²+0.27²)≈0.42. Nav2 держит центр
                           # не ближе к препятствиям. Для узких проёмов можно перейти на прямоугольный футпринт.
wheel_base: 0.54           # м — колея (центр↔центр ведущих колёс), замер. Уточнить 360°-тестом
                           # (если это внешняя ширина с колёсами — реальная колея чуть меньше). # CALIBRATE

base:                       # габариты корпуса: телега 65×54 с колёсами (платформа-основа 60×40)
  length: 0.65              # X, м
  width:  0.54              # Y, м (с колёсами)
  height: 0.15              # Z, м  # CALIBRATE
wheel_radius: 0.0825        # м — радиус колеса Ø165мм (замер): высота base_link + пересчёт одометрии VESC.

# Привод: Dual VESC (Flipsky 6.7), 2 мотора-гироскутера (BLDC, FOC + датчики Холла), одна плата, один USB.
# Локальную половину командуем напрямую по USB, вторую — forward-CAN по её внутреннему CAN-id.
# Узел vesc_diff_drive берёт геометрию (wheel_radius, wheel_base) отсюда же — единый источник.
drivetrain:
  # Обе половины — каждая по СВОЕМУ USB (CAN между половинами не заработал, выкинули).
  # Узел сам определяет, где какая половина, по VESC-id из ответа платы → порядок портов неважен.
  ports: [/dev/ttyACM0, /dev/ttyACM1]
  pole_pairs: 20            # новые 24В моторы: 20 пар полюсов (замер по тахометру: 1199 тиков / 10 оборотов)
  gear_ratio: 1.0           # прямой привод (хаб-мотор), редуктора нет
  max_speed: 1.0            # м/с — потолок команды
  accel_limit: 1.2          # м/с² — ограничение ускорения (плавный старт/стоп)
  cmd_timeout: 0.4          # с — тишина в cmd_vel → выбег
  rate_hz: 50.0             # Гц — цикл управления и опрос одометрии
  # Замкнутый контур скорости по току: ток = kff·v + kp·ошибка + ki·∫ошибка. Компенсирует нагрузку
  # и разницу моторов, стартует с низов. Больше груз → сам поднимает ток (до max_current).
  speed_kp: 8.0             # под быстрые 24В моторы, тюнинг на ПОЛУ (на весу идут вразнос)
  speed_ki: 14.0
  speed_kff: 3.0            # А на м/с — упреждение
  max_current: 10.0         # А, потолок тока на мотор = лимит VESC 10А (новые 24В моторы)
  left:
    vesc_id: 52             # какая половина (по VESC-id) — левый борт   # CALIBRATE
    invert: false           # знак так, чтобы + = вперёд                 # CALIBRATE
  right:
    vesc_id: 4              # какая половина (по VESC-id) — правый борт
    invert: false           # +ток = вперёд на ОБОИХ бортах (замер джогом: id4 +2А → робот вперёд).
                            # Инверсий на этом шасси нет; VESC Tool задаёт «forward»-фазу каждого мотора.

sensors:
  # base_footprint = ось ведущих колёс (центр вращения), стоит СЗАДИ — 56см от переднего края телеги.
  # Корпус целиком впереди оси → все сенсоры с +x. z = высота над полом (рулеткой).
  lidar:                    # RPLIDAR A1: развёрнут 180° (разъём вперёд)
    xyz: [0.43, 0.0, 0.195] # 43см вперёд от оси, по центру, 19.5см над полом
    rpy: [0.0, 0.0, 3.14159265]   # yaw=π (монтаж 180°, разъём вперёд)

  camera:                   # моно USB, по центру, смотрит вперёд ровно
    xyz: [0.56, 0.0, 0.11]  # передний край (56см вперёд от оси), 11см над полом  # CALIBRATE x, если камера утоплена
    rpy: [0.0, 0.0, 0.0]    # CALIBRATE небольшой pitch/перекос — критично для проекции на пол
    hfov_deg: 70.0          # поле зрения — для интринсик и пеленга  # CALIBRATE
    width:  1280            # px
    height: 720             # px

  imu:                      # BNO085 — рядом с лидаром, на 3см ближе к оси. Позиция некритична (фьюзим yaw/vyaw)
    xyz: [0.40, 0.0, 0.10]  # 40см вперёд от оси; z ≈ высота платы  # CALIBRATE z
    rpy: [0.0, 0.0, 0.0]    # CALIBRATE roll=π если курс зеркалит
