[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenhouse-contracts"
version = "0.1.0"
description = "Shared typed contracts for GreenHouse robot, sim, and backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greenhouse_contracts = ["py.typed"]

[project.optional-dependencies]
dev = ["mypy>=1.8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["greenhouse_contracts"]
mypy_path = "src"
