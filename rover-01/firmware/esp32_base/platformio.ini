; rover-01 — прошивка ESP32 как micro-ROS нода
; Транспорт: Serial (USB) к Jetson.
;
; Версия платформы зафиксирована: espressif32 6.x даёт Arduino-core 2.0.x,
; где работает API ledcSetup/ledcAttachPin/ledcWrite (используется в main.cpp).
; На Arduino-core 3.x этот API изменён — не повышай платформу без правки PWM.

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; Скорость USB-порта. ДОЛЖНА совпадать с baudrate micro-ROS агента на Jetson:
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyUSB0 -b 115200
monitor_speed = 115200
board_microros_transport = serial

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; Если board_microros_distro не подхватится автоматически — раскомментируй
; и укажи дистрибутив ROS2 на Jetson (например, humble или jazzy):
; board_microros_distro = humble
