; rover-01 — прошивка ESP32. ДВЕ сборки:
;   [env:microros]  — рабочая: ESP32 как ROS2-нода, /cmd_vel по Serial (USB) к Jetson.
;   [env:webtest]   — тестовая: Wi-Fi AP + веб-пульт, управление из браузера без Jetson.
;
; Обе используют общий моторный модуль src/motor_control.cpp, поэтому веб-команды
; действуют на робота так же, как ROS-команды (включая watchdog).
;
; Выбор сборки:
;   pio run -e microros -t upload     # рабочая прошивка
;   pio run -e webtest  -t upload     # веб-пульт для тестов
;
; Версия платформы зафиксирована: espressif32 6.x даёт Arduino-core 2.0.x,
; где работает API ledcSetup/ledcAttachPin/ledcWrite. На core 3.x он изменён —
; не повышай платформу без правки PWM в motor_control.cpp.

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; ───────────── Рабочая сборка: micro-ROS по Serial ─────────────
[env:microros]
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
; общий модуль + только microros-main (исключаем webtest)
build_src_filter = +<motor_control.cpp> +<microros/>
; baudrate USB должен совпадать с агентом на Jetson:
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyUSB0 -b 115200
; Если нужно — укажи дистрибутив ROS2 на Jetson:
; board_microros_distro = humble

; ───────────── Тестовая сборка: Wi-Fi AP + веб-пульт ─────────────
[env:webtest]
; micro-ROS НЕ нужен — только стандартные WiFi/WebServer из Arduino-core.
; общий модуль + только webtest-main (исключаем microros)
build_src_filter = +<motor_control.cpp> +<webtest/>
